services:
  postgres:
    image: postgres:15-alpine
    container_name: adventurer_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: adventurer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adventurer_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prisma-studio:
    image: node:18-alpine
    container_name: adventurer_prisma_studio
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npx prisma studio --port 5500 --hostname 0.0.0.0 --browser none --schema ./server/prisma/schema.prisma"
    ports:
      - "5500:5500"
    environment:
      - DATABASE_URL=postgresql://user:password@adventurer_postgres:5432/adventurer_db
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: